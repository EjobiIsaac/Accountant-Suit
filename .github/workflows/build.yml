name: Build Accountant Suite EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pywebview pyinstaller
      - run: pyinstaller --onefile --windowed --name "ACCOUNTANT-SUITE-v1.0" --add-data "index.html;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ACCOUNTANT-SUITE-EXE
          path: dist/ACCOUNTANT-SUITE-v1.0.exe
